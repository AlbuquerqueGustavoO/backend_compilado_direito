name: Backend CI/CD

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Preparar chave SSH temporária
        run: |
          echo "$SSH_PRIVATE_KEY" > ./deploy_id_rsa
          chmod 600 ./deploy_id_rsa
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Aguardar SSH disponível (tentativas com backoff)
        run: |
          HOST=${{ secrets.SSH_HOST }}
          USER=${{ secrets.SSH_USERNAME }}
          PORT=${{ secrets.SSH_PORT || '22' }}
          ATTEMPTS=6
          SLEEP=10
          i=0
          until ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i ./deploy_id_rsa -p $PORT "$USER@$HOST" exit 2>/dev/null; do
            i=$((i+1))
            echo "Tentativa $i: SSH não disponível ainda. Aguardando $SLEEP segundos..."
            if [ $i -ge $ATTEMPTS ]; then
              echo "SSH ainda indisponível após $ATTEMPTS tentativas. Abortando deploy."
              exit 1
            fi
            sleep $SLEEP
          done

      - name: Deploy Backend na VPS (via appleboy/ssh-action)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          timeout: '120s'
          script: |
            cd /root/backend_compilado_direito

            echo "Atualizando repositório..."
            git pull origin master

            echo "Instalando dependências..."
            npm install --production

            echo "Atualizando variáveis de ambiente..."
            cat > .env <<ENVFILE
            NODE_ENV=production
            CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
            SWAGGER_SERVER_URL=${{ secrets.SWAGGER_SERVER_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN || '7d' }}
            ENVFILE

            echo "Reiniciando backend..."
            pm2 restart compiladodeleis-backend --update-env || pm2 start npm --name compiladodeleis-backend -- start

            echo "Salvando PM2..."
            pm2 save

            echo "Deploy finalizado com sucesso!"